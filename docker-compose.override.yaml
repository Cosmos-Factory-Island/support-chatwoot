version: '3'

services:
  rails:
    ports: []
    
  postgres:
    ports: !reset []
    environment:
      - POSTGRES_PASSWORD=chatwoot
    
  redis:
    ports: !reset []

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
  
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - rails

volumes:
  caddy_data:
  caddy_config:
